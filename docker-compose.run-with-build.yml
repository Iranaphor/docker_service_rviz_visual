# ###########################################################################
# Docker Compose XPRA Overlay Template for ROS Projects
#
# Template file for adding browser-based RViz visualization via XPRA HTML5
# to existing ROS Docker Compose projects.
#
# @author      James R. Heselden (github: iranaphor)
# @maintainer  James R. Heselden (github: iranaphor)
# @datecreated 30th November 2025
# @credits     Code structure and implementation were developed by the
#              author with assistance from Anthropic's Claude Sonnet 4.5
#              model via GitHub Copilot, used under the author's direction
#              and supervision.
#
###########################################################################

services:
  rviz2xpra:
    #
    build: ./rviz2xpra
    ports:
      - "14500:14500"
    network_mode: bridge
    container_name: rviz2xpra
    ipc: "host"
    volumes:
      - x11:/tmp/.X11-unix:rw
    environment:
      #- DISPLAY=:1
      - QT_X11_NO_MITSHM=1
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      exec xpra start :100
      --bind-tcp=0.0.0.0:14500
      --html=on
      --start-child='xterm'
      --exit-with-children
      --daemon=no
      --pulseaudio=no
      --notifications=no
      --bell=no
      --mdns=no"


  rviz2_window_headless:
    extends:
      file: samples/docker-compose.sample-rviz2-headless.yml
      service: rviz2_window_headless
    container_name: rviz2_window_headless
    volumes:
      - x11:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=1
      - DISPLAY=:100
      - QT_X11_NO_MITSHM=1
    depends_on:
      rviz2xpra:
        condition: service_started
    command: 'bash -c "sleep 3 && rviz2"'


  marker_publisher:
    extends:
      file: samples/docker-compose.sample-cube.yml
      service: marker_publisher
    environment:
      - ROS_DOMAIN_ID=1


volumes:
  x11:
