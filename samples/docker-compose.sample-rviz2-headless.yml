#              and supervision.
#
###########################################################################

services:
  rviz2_window_headless:
    image: osrf/ros:humble-desktop-full
    container_name: ros2-rviz2-window-headless
    network_mode: bridge
    ipc: "host"
    volumes:
      - x11:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=1
      - DISPLAY=:100
      - QT_X11_NO_MITSHM=1
    command: "rviz2"

volumes:
  x11:
